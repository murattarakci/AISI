<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facilitator View | IMD AI Strategy and Implementation</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="firebase-config.js"></script>
<style>
  :root { --imd-navy:#000A56; --imd-blue:#005DC4; --imd-light-blue:#D7EAF7; --imd-ecru:#F5F4EE; --imd-white:#FFFFFF; --sky:#9FE1FF; --orange:#FC6B27; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Public Sans","Helvetica Neue",Arial,sans-serif; background:var(--imd-ecru); color:var(--imd-navy); min-height:100vh; }
  #gate { position:fixed; inset:0; background:var(--imd-navy); background-image:radial-gradient(rgba(255,255,255,0.18) 1.1px, transparent 1.1px); background-size:26px 26px; display:flex; align-items:center; justify-content:center; z-index:1000; }
  .gate-box { text-align:center; padding:20px; }
  .gate-box h1 { color:var(--imd-white); font-weight:700; font-size:26px; margin-bottom:18px; }
  .gate-box input { font-family:inherit; font-size:17px; padding:13px 18px; border-radius:999px; border:none; width:280px; text-align:center; outline:none; }
  .gate-box button { font-family:inherit; font-size:16px; font-weight:600; margin-left:10px; padding:13px 26px; border-radius:999px; border:none; background:var(--imd-blue); color:var(--imd-white); cursor:pointer; }
  .gate-error { color:var(--orange); font-size:14px; margin-top:14px; min-height:18px; }

  header { background:var(--imd-navy); color:var(--imd-white); padding:18px 28px; display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  header .brand { font-weight:700; font-size:19px; letter-spacing:-0.01em; }
  header .count { font-weight:300; font-size:15px; color:var(--imd-light-blue); }
  .filters { margin-left:auto; display:flex; gap:18px; flex-wrap:wrap; align-items:baseline; }
  .filter-btn { font-family:inherit; font-size:13px; font-weight:300; padding:4px 2px; cursor:pointer; border:none; background:transparent; color:rgba(215,234,247,0.55); border-bottom:1px solid transparent; }
  .filter-btn:hover { color:rgba(215,234,247,0.85); }
  .filter-btn.active { color:var(--imd-white); border-bottom-color:var(--imd-white); }

  #list { padding:20px 28px 50px; max-width:1150px; margin:0 auto; }
  .lrow { display:grid; grid-template-columns:1fr 82px 130px 74px 40px; gap:14px; align-items:center; background:var(--imd-white); border-radius:10px; padding:16px 20px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,10,86,0.06); }
  .lrow.head { background:transparent; box-shadow:none; padding:6px 20px; margin-bottom:4px; font-size:12px; font-weight:300; color:#6a6f8e; text-transform:uppercase; letter-spacing:0.06em; }
  .lrow.flagged { opacity:0.45; }
  .c-card .stmt { font-weight:600; font-size:17px; line-height:1.3; letter-spacing:-0.01em; }
  .c-card .stmt .fill { color:var(--imd-blue); }
  .c-card .sub { font-weight:300; font-size:13px; color:#6a6f8e; margin-top:3px; }
  .c-card .flag-note { font-weight:600; font-size:11px; color:var(--orange); margin-top:3px; text-transform:uppercase; letter-spacing:0.05em; }
  .c-score { font-weight:600; font-size:15px; text-align:center; }
  .c-score.dim { color:#b6b9c9; font-weight:300; }
  .c-date { font-weight:300; font-size:13px; color:#6a6f8e; text-align:center; }
  .c-show { font-family:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer; border:1.5px solid var(--imd-blue); background:transparent; color:var(--imd-blue); }
  .c-show:hover { background:var(--imd-light-blue); }
  .c-del { background:none; border:none; cursor:pointer; color:#b6b9c9; font-size:19px; line-height:1; font-family:inherit; padding:6px; justify-self:center; }
  .c-del:hover { color:var(--orange); }
  #empty { text-align:center; padding:80px 20px; font-weight:300; font-size:17px; color:#3a4066; }

  #big[hidden] { display:none; }
  #big { position:fixed; inset:0; z-index:900; background:var(--imd-navy); background-image:radial-gradient(rgba(255,255,255,0.2) 1.4px, transparent 1.4px); background-size:34px 34px; display:flex; flex-direction:column; justify-content:center; padding:6vw 8vw; overflow:auto; }
  #big .stmt { color:var(--imd-white); font-weight:600; font-size:clamp(28px,4.6vw,68px); line-height:1.18; letter-spacing:-0.01em; }
  #big .stmt .fill { color:var(--sky); }
  #big .sub { color:rgba(255,255,255,0.8); font-weight:300; font-size:clamp(15px,1.6vw,22px); margin-top:2.5vh; }
  #big .detail { margin-top:5vh; display:grid; grid-template-columns:1fr 1fr; gap:2.5vh 4vw; max-width:1100px; }
  #big .df { border-top:1px solid rgba(255,255,255,0.22); padding-top:1.2vh; }
  #big .df.wide { grid-column:1 / -1; }
  #big .df .l { color:var(--sky); font-size:clamp(10px,0.9vw,13px); font-weight:600; letter-spacing:0.09em; text-transform:uppercase; margin-bottom:0.6vh; }
  #big .df .v { color:var(--imd-white); font-size:clamp(14px,1.5vw,19px); line-height:1.3; }
  #big .df .v.empty { color:rgba(255,255,255,0.35); }
  #big .close { position:absolute; top:24px; right:30px; background:none; border:2px solid rgba(255,255,255,0.4); border-radius:999px; color:rgba(255,255,255,0.75); cursor:pointer; font-family:inherit; font-size:14px; font-weight:600; padding:9px 18px; }
  #big .close:hover { border-color:var(--imd-white); color:var(--imd-white); }

  @media (max-width:760px) { .lrow { grid-template-columns:1fr 60px 64px 36px; } .c-date { display:none; } #big .detail { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="gate"><div class="gate-box"><h1>Facilitator View</h1>
  <form id="gate-form"><input type="password" id="pw" placeholder="Password" autocomplete="off" autofocus><button type="submit">Enter</button></form>
  <p class="gate-error" id="gate-error"></p></div></div>

<header>
  <span class="brand">IMD / AISI Facilitator View</span>
  <span class="count" id="count"></span>
  <div class="filters"><button class="filter-btn" id="f-today">Today only</button></div>
</header>

<div id="list"></div>
<p id="empty" hidden>No briefs yet. They appear here live as tables fill theirs in, sorted by the sharpest "not / but" contrast.</p>

<div id="big" hidden>
  <button class="close" id="big-close">Back to list (Esc)</button>
  <p class="stmt" id="big-stmt"></p>
  <p class="sub" id="big-sub"></p>
  <div class="detail" id="big-detail"></div>
</div>

<script type="module">
const PW_HASH = "549c7fee864542f5de2f19293bd6ca2236c5e38588b3983508055d2e9dfbfbc3";
const COLL = window.FIREBASE_COLLECTION || "aisi_briefs";
const LABELS = { substitution:"Substitution", augmentation:"Augmentation" };

async function sha256(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join(""); }
const gate = document.getElementById("gate");
document.getElementById("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if ((await sha256(document.getElementById("pw").value)) === PW_HASH) { sessionStorage.setItem("fac", "1"); gate.remove(); start(); }
  else document.getElementById("gate-error").textContent = "Wrong password.";
});

let briefs = [], todayOnly = false, started = false, db = null, fsDoc = null, fsSetDoc = null;
const list = document.getElementById("list"), empty = document.getElementById("empty"), countEl = document.getElementById("count");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---------- contrast scoring: in-browser MiniLM embeddings, same approach as LTAIS ---------- */
let extractor = null;
const scoreCache = new Map();
async function ensureModel() {
  if (extractor) return;
  const { pipeline, env } = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/+esm");
  env.allowLocalModels = false;
  extractor = await pipeline("feature-extraction", "Xenova/all-MiniLM-L6-v2");
}
async function contrastScore(b1, b2) {
  const key = b1 + " || " + b2;
  if (scoreCache.has(key)) return scoreCache.get(key);
  const [e1, e2] = await Promise.all([
    extractor(b1, { pooling: "mean", normalize: true }),
    extractor(b2, { pooling: "mean", normalize: true })
  ]);
  let dot = 0;
  for (let i = 0; i < e1.data.length; i++) dot += e1.data[i] * e2.data[i];
  const score = (1 - dot) / 2; // 0 = same meaning, 1 = maximal contrast
  scoreCache.set(key, score);
  return score;
}
async function scoreAll() {
  if (!extractor) return;
  for (const b of briefs) if (b.rewire_not && b.rewire_but) b.score = await contrastScore(b.rewire_not, b.rewire_but);
}

/* ---------- profanity check: flagged briefs sink to the bottom ---------- */
const PROFANITY = /\b(fuck\w*|shit\w*|bitch\w*|cunt\w*|asshole\w*|arsehole\w*|bastard\w*|dickhead\w*|wanker\w*|slut\w*|whore\w*|nigg\w+|fag\w*|retard\w*|piss\w*|bollocks|bullshit|motherfuck\w*|cock\w*|twat\w*)\b/i;
function isFlagged(b) { return PROFANITY.test([b.rewire_not, b.rewire_but, b.table, b.process, b.constraint].join(" ")); }

function stmtHTML(b) {
  const n = b.rewire_not ? '<span class="fill">' + esc(b.rewire_not) + "</span>" : "____";
  const t = b.rewire_but ? '<span class="fill">' + esc(b.rewire_but) + "</span>" : "____";
  return "Our rewire is not " + n + ", but " + t + ".";
}

function render() {
  const sod = new Date(); sod.setHours(0, 0, 0, 0);
  const shown = briefs.filter((b) => !(todayOnly && (!b.ts || b.ts < sod)));
  shown.sort((a, b) => {
    if (a.flagged !== b.flagged) return a.flagged ? 1 : -1;
    const byScore = (b.score ?? -1) - (a.score ?? -1);
    if (byScore !== 0) return byScore;
    return (b.ts?.getTime() ?? 0) - (a.ts?.getTime() ?? 0);
  });
  countEl.textContent = shown.length + " brief" + (shown.length === 1 ? "" : "s");
  empty.hidden = shown.length > 0;
  const head = '<div class="lrow head"><span>Brief</span><span style="text-align:center">Contrast</span><span style="text-align:center">Entered</span><span></span><span></span></div>';
  list.innerHTML = (shown.length ? head : "") + shown.map((b) => {
    const score = b.score != null ? '<span class="c-score">' + Math.round(b.score * 100) + "</span>" : '<span class="c-score dim">&ndash;</span>';
    const when = b.ts ? b.ts.toLocaleString([], { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "&ndash;";
    return (
      '<div class="lrow' + (b.flagged ? " flagged" : "") + '">' +
      '<div class="c-card"><p class="stmt">' + stmtHTML(b) + "</p>" +
      (b.table || b.process ? '<p class="sub">' + [b.table, b.process].filter(Boolean).map(esc).join(" — ") + "</p>" : "") +
      (b.flagged ? '<p class="flag-note">Flagged: possible profanity</p>' : "") +
      "</div>" + score +
      '<span class="c-date">' + when + "</span>" +
      '<button class="c-show" data-id="' + esc(b.id) + '">View</button>' +
      '<button class="c-del" data-id="' + esc(b.id) + '" title="Remove this brief">&times;</button></div>'
    );
  }).join("");
}

const big = document.getElementById("big");
function openBig(b) {
  document.getElementById("big-stmt").innerHTML = stmtHTML(b);
  document.getElementById("big-sub").innerHTML = [b.table, b.process].filter(Boolean).map(esc).join(" &mdash; ");
  const F = [["constraint","Its binding constraint",1],["task","The task we move",0],["change","What we expect to change",0],
             ["know","How we will know",0],["notyet","What we will not automate yet",0]];
  document.getElementById("big-detail").innerHTML = F.map(([k, l, wide]) => {
    let v = b[k] || "";
    if (k === "task" && b.mode) v = (v ? v + " " : "") + "(" + (LABELS[b.mode] || b.mode) + ")";
    return '<div class="df' + (wide ? " wide" : "") + '"><div class="l">' + l + '</div><div class="v' + (v ? "" : " empty") + '">' + (v ? esc(v) : "—") + "</div></div>";
  }).join("");
  big.hidden = false;
}
function closeBig() { big.hidden = true; }
document.getElementById("big-close").addEventListener("click", closeBig);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeBig(); });

list.addEventListener("click", async (e) => {
  const show = e.target.closest(".c-show");
  if (show) { const b = briefs.find((x) => x.id === show.dataset.id); if (b) openBig(b); return; }
  const del = e.target.closest(".c-del");
  if (del && db) { if (!confirm("Remove this brief from the view?")) return; await fsSetDoc(fsDoc(db, COLL, del.dataset.id), { hidden: true }, { merge: true }); }
});
document.getElementById("f-today").addEventListener("click", (e) => { todayOnly = !todayOnly; e.target.classList.toggle("active", todayOnly); render(); });

async function start() {
  if (started) return; started = true;
  if (!window.FIREBASE_CONFIG) { empty.hidden = false; empty.textContent = "Firebase is not configured yet. Fill in firebase-config.js to start collecting briefs."; return; }
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const { getFirestore, collection, query, orderBy, onSnapshot, doc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  db = getFirestore(initializeApp(window.FIREBASE_CONFIG)); fsDoc = doc; fsSetDoc = setDoc;

  ensureModel().then(() => scoreAll()).then(render).catch((e) => console.warn("model load failed", e));

  onSnapshot(query(collection(db, COLL), orderBy("ts", "desc")), (snap) => {
    briefs = snap.docs.filter((d) => !d.data().hidden).map((d) => {
      const v = d.data();
      const b = { id: d.id, ...v, ts: v.ts && v.ts.toDate ? v.ts.toDate() : null, score: null };
      b.flagged = isFlagged(b);
      return b;
    });
    render();
    if (extractor) scoreAll().then(render);
  }, (err) => {
    empty.hidden = false;
    empty.textContent = err.code === "permission-denied"
      ? "Firestore rules do not yet allow the '" + COLL + "' collection. Add the rule from firebase-config.js in the Firebase console."
      : "Could not load briefs: " + err.message;
  });
}
if (sessionStorage.getItem("fac") === "1") { gate.remove(); start(); }
</script>
</body>
</html>
